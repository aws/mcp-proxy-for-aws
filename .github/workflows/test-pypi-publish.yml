name: Test PyPI Publishing

on:
  workflow_dispatch:

permissions: {}

jobs:
  call-test:
    permissions:
      contents: read
      pull-requests: read
      security-events: write
      actions: read
    with:
      ref: ${{ github.event.release.target_commitish }}
    uses: ./.github/workflows/python.yml

  call-integ-tests:
    permissions:
      id-token: write
      contents: read
      actions: read
    uses: ./.github/workflows/python-integ.yml
    with:
      ref: ${{ github.event.release.target_commitish }}
    secrets: inherit

  build:
    needs: [call-test, call-integ-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write    # Required for SLSA provenance signing via Sigstore
      attestations: write # Required to write attestations to the GitHub repo
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@e4db8464a088ece1b920f60402e813ea4de65b8f # v4

      # Mirrors the real release workflow: the pinned wrapper sits outside the uv
      # workspace, so `uv build` alone would silently produce only the library. See the
      # comment in pypi-publish-on-release.yml.
      - name: Build the library distribution
        run: uv build

      # `-o dist` is required: `uv build <path>` defaults to <path>/dist, which the later
      # attestation/upload/publish steps (all globbing ./dist) would skip.
      - name: Build the pinned wrapper distribution
        run: uv build packages/proxy -o dist

      - name: Generate SLSA provenance attestations
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/**

      - name: Generate PEP 740 attestations for PyPI
        # Produces .publish.attestation sidecar files in dist/ which uv publish
        # automatically discovers and uploads to PyPI alongside the distributions.
        run: uv tool run --exclude-newer P7D pypi-attestations sign dist/*

      - name: Upload distribution packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-package-distributions
          path: dist/

  deploy-test:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/mcp-proxy-for-aws
    permissions:
      id-token: write
    steps:
      - name: Download distribution packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist/

      - name: Set up uv
        uses: astral-sh/setup-uv@e4db8464a088ece1b920f60402e813ea4de65b8f # v4

      # Code package first: the wrapper pins `mcp-proxy-for-aws==<version>`, so the reverse
      # order leaves the wrapper briefly unresolvable. See pypi-publish-on-release.yml.
      - name: Publish the code package to TestPyPI
        run: |
          uv publish --publish-url https://test.pypi.org/legacy/ \
            dist/mcp_proxy_for_aws-*.tar.gz dist/mcp_proxy_for_aws-*.whl

      - name: Publish the pinned wrapper to TestPyPI
        run: |
          uv publish --publish-url https://test.pypi.org/legacy/ \
            dist/mcp_proxy_for_aws_cli-*.tar.gz dist/mcp_proxy_for_aws_cli-*.whl
