# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Etc/UTC"
    commit-message:
      prefix: "chore(deps): update github-actions"
    groups:
      github-actions-version-updates:
        applies-to: version-updates
        patterns:
          - "*"

  - package-ecosystem: "uv"
    directories:
      - "/" # Searches for uv.lock in Root
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Etc/UTC"
    # Supply-chain cooldown: don't adopt a release until it has been public for a few days,
    # so a compromised upload has time to be yanked before it reaches our lock (and, via
    # the build-time pin hook, the published mcp-proxy-for-aws wrapper). We keep the
    # cooldown here rather than in uv's `exclude-newer` so it is independent of the uv
    # version resolving the lock: recent uv can express a rolling window via an
    # `exclude-newer` duration, but older uv rejects durations and silently drops the setting.
    cooldown:
      default-days: 3
    commit-message:
      prefix: "chore(deps): update uv"
    groups:
      uv-version-updates:
        applies-to: version-updates
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directories:
      - "/" # Searches for Dockerfile in Root
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Etc/UTC"
    commit-message:
      prefix: "chore(deps): update docker images"
    groups:
      docker-version-updates:
        applies-to: version-updates
        patterns:
          - "*"

  - package-ecosystem: "pip"
    directories:
      - "/" # Searches for pyproject.toml in Root
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Etc/UTC"
    # See the cooldown note on the `uv` ecosystem above.
    cooldown:
      default-days: 3
    commit-message:
      prefix: "chore(deps): update pip"
    groups:
      python-version-updates:
        applies-to: version-updates
        patterns:
          - "*"
